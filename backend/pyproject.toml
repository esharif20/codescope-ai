[project]
name = "codescope-backend"
version = "0.1.0"
description = "CodeScope AI backend: static analysis, API and RAG layers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    # Pinned <0.26: tree-sitter 0.26.0 has a reference-counting bug in its Node
    # binding that segfaults when child_by_field_name()+.text are called
    # repeatedly while walking deeply nested trees (empirically reproduced:
    # consistent SIGSEGV around 65+ nested function defs on 0.26.0; 0.25.2 is
    # clean through 150+). Re-test before raising this ceiling.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
codescope-parse = "app.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit, so test collection does not depend on the editable install's
# sys.path injection working. Observed on this machine: uv (0.11.2) writes
# the editable-install .pth with the macOS UF_HIDDEN flag set, which
# CPython 3.13's site.py silently skips (a real security hardening change,
# not a bug in this project) -- breaking `import app` for anything that
# doesn't get cwd-on-sys.path "for free" (`-m`, `-c`), pytest included.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042 (str, Enum -> StrEnum) is deliberately ignored: the pinned Symbol
# contract specifies `class X(str, Enum)` exactly, and ruff itself marks the
# StrEnum rewrite an "unsafe fix" that can change runtime behavior.
ignore = ["UP042"]
