[project]
name = "codescope-backend"
version = "0.1.0"
description = "CodeScope AI backend: static analysis, API and RAG layers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    # Pinned <0.26: tree-sitter 0.26.0 has a reference-counting bug in its Node
    # binding that segfaults when child_by_field_name()+.text are called
    # repeatedly while walking deeply nested trees (empirically reproduced:
    # consistent SIGSEGV around 65+ nested function defs on 0.26.0; 0.25.2 is
    # clean through 150+). Re-test before raising this ceiling.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
codescope-parse = "app.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit as defense-in-depth, not a required workaround: uv<0.13 wrote the
# editable-install .pth with macOS's UF_HIDDEN flag set, which CPython 3.13's
# site.py silently skips (security hardening, not a project bug), breaking
# `import app` for anything relying on the .pth. Fixed upstream in uv 0.13.0
# (confirmed) and enforced here via [tool.uv] required-version below, but
# kept anyway so test collection never depends on editable-install .pth
# mechanics at all, on any uv version.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042 (str, Enum -> StrEnum) is deliberately ignored: the pinned Symbol
# contract specifies `class X(str, Enum)` exactly, and ruff itself marks the
# StrEnum rewrite an "unsafe fix" that can change runtime behavior.
ignore = ["UP042"]

[tool.uv]
# <0.13 wrote the editable-install .pth with macOS's UF_HIDDEN flag set,
# which CPython 3.13 silently skips -- breaking `import app` for the
# installed console script. Confirmed fixed in 0.13.0; enforced here so
# `uv sync`/`uv run` fail fast with a clear message instead of silently
# reproducing it. `uv self update` (or `pip install --upgrade uv` if uv was
# itself installed via pip) to fix.
required-version = ">=0.13"
